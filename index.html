<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#10131c">
	<title>Tic Tac Toe — Make your move</title>
	<style>
		:root{color-scheme:dark;--bg:#10131c;--panel:#191d29;--panel2:#222738;--line:rgba(255,255,255,.09);--muted:#939bb0;--text:#f5f6fb;--cyan:#66e4d3;--pink:#ff8eaa;--gold:#ffc96b}
		*{box-sizing:border-box}body{min-height:100vh;margin:0;padding:32px 18px;display:grid;place-items:center;overflow-x:hidden;color:var(--text);background:radial-gradient(ellipse at 50% 0%,#252b40 0,var(--bg) 58%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.app{width:min(100%,470px)}
		.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:27px}.brand{display:flex;align-items:center;gap:11px;font-size:15px;font-weight:750;letter-spacing:-.02em}.brand-mark{display:grid;width:35px;height:35px;place-items:center;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--cyan);font-size:17px}.eyebrow{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}h1{margin:0;font-size:clamp(32px,8vw,43px);line-height:1.08;letter-spacing:-.055em}.intro{margin:9px 0 23px;color:var(--muted);font-size:14px}
		.mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px;border:1px solid var(--line);border-radius:14px;background:rgba(25,29,41,.82)}.mode-button{min-height:39px;border:0;border-radius:10px;color:var(--muted);background:transparent;font-size:13px;font-weight:700;cursor:pointer;transition:.18s ease}.mode-button:hover{color:var(--text)}.mode-button[aria-pressed=true]{color:var(--text);background:var(--panel2);box-shadow:0 2px 8px #0003}
		.scoreboard{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:15px 0}.score-card{padding:13px 10px 12px;text-align:center;border:1px solid var(--line);border-radius:14px;background:rgba(25,29,41,.78);transition:border-color .2s,transform .2s}.score-card.active{border-color:color-mix(in srgb,var(--accent) 50%,transparent);transform:translateY(-2px)}.score-label{display:flex;justify-content:center;align-items:center;gap:6px;color:var(--muted);font-size:11px;font-weight:700}.score-symbol{color:var(--accent);font-size:13px}.score-number{display:block;margin-top:5px;font-size:24px;font-weight:750;line-height:1;font-variant-numeric:tabular-nums}.score-x{--accent:var(--cyan)}.score-o{--accent:var(--pink)}.score-draw{--accent:var(--gold)}
		.game-panel{padding:17px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,rgba(30,35,50,.96),rgba(22,25,36,.96));box-shadow:0 20px 60px #0003}.game-meta{min-height:35px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 2px 13px}.status{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700}.status-dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px currentColor}.status-dot.o{background:var(--pink)}.status-dot.draw{background:var(--gold)}.round-label{color:var(--muted);font-size:11px;font-weight:650}
		.board{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;aspect-ratio:1}.cell{display:grid;place-items:center;padding:0;border:1px solid rgba(255,255,255,.075);border-radius:15px;background:#222738;color:var(--text);font-size:clamp(43px,14vw,68px);font-weight:650;line-height:1;cursor:pointer;transition:background .16s,border-color .16s,transform .16s,box-shadow .16s;-webkit-tap-highlight-color:transparent}.cell:not(:disabled):hover{transform:translateY(-2px);border-color:rgba(255,255,255,.2);background:#292f43}.cell:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:3px}.cell:disabled{cursor:default}.cell.x{color:var(--cyan);text-shadow:0 0 25px rgba(102,228,211,.18)}.cell.o{color:var(--pink);text-shadow:0 0 25px rgba(255,142,170,.18)}.cell.winner{border-color:color-mix(in srgb,var(--winner) 65%,transparent);background:color-mix(in srgb,var(--winner) 13%,#222738);box-shadow:inset 0 0 22px color-mix(in srgb,var(--winner) 10%,transparent)}.cell.winner.x{--winner:var(--cyan)}.cell.winner.o{--winner:var(--pink)}
		.actions{display:flex;gap:9px;margin-top:14px}.action-button{min-height:43px;padding:0 15px;border:1px solid var(--line);border-radius:12px;color:var(--text);background:var(--panel2);font-size:12px;font-weight:700;cursor:pointer;transition:.16s ease}.action-button:hover{border-color:rgba(255,255,255,.2);background:#292f43}.action-button.primary{flex:1;border-color:transparent;color:#101821;background:var(--cyan)}.action-button.primary:hover{background:#83f0e2}.action-button:active,.mode-button:active{transform:scale(.98)}.hint{margin:17px 0 0;color:var(--muted);text-align:center;font-size:11px}
		@media(max-width:380px){body{padding:22px 13px}.game-panel{padding:12px}.board{gap:7px}.cell{border-radius:12px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important}}
	</style>
</head>
<body>
	<main class="app">
		<header class="topline"><div class="brand"><span class="brand-mark" aria-hidden="true">✳</span> LITTLE BIG GAMES</div><span class="eyebrow">NO. 01 / CLASSIC</span></header>
		<section aria-labelledby="page-title"><h1 id="page-title">Tic Tac Toe<span style="color:var(--cyan)">.</span></h1><p class="intro">Three in a row. A little friendly competition.</p></section>
		<div class="mode-switch" role="group" aria-label="Choose game mode"><button class="mode-button" id="two-player-mode" type="button" aria-pressed="true">Two players</button><button class="mode-button" id="computer-mode" type="button" aria-pressed="false">Vs. computer</button></div>
		<section class="scoreboard" aria-label="Scoreboard">
			<div class="score-card score-x active" id="score-card-x"><span class="score-label"><span class="score-symbol">×</span> YOU / X</span><strong class="score-number" id="score-x">0</strong></div>
			<div class="score-card score-draw" id="score-card-draw"><span class="score-label">DRAWS</span><strong class="score-number" id="score-draw">0</strong></div>
			<div class="score-card score-o" id="score-card-o"><span class="score-label"><span class="score-symbol">○</span> <span id="o-label">PLAYER 2 / O</span></span><strong class="score-number" id="score-o">0</strong></div>
		</section>
		<section class="game-panel" aria-label="Tic tac toe game">
			<div class="game-meta"><div class="status" aria-live="polite" aria-atomic="true"><span class="status-dot" id="status-dot"></span><span id="status-text">X's turn</span></div><span class="round-label" id="round-label">ROUND 1</span></div>
			<div class="board" id="board" role="group" aria-label="Game board">
				<button class="cell" type="button" data-index="0" aria-label="Top left, empty"></button><button class="cell" type="button" data-index="1" aria-label="Top middle, empty"></button><button class="cell" type="button" data-index="2" aria-label="Top right, empty"></button>
				<button class="cell" type="button" data-index="3" aria-label="Middle left, empty"></button><button class="cell" type="button" data-index="4" aria-label="Center, empty"></button><button class="cell" type="button" data-index="5" aria-label="Middle right, empty"></button>
				<button class="cell" type="button" data-index="6" aria-label="Bottom left, empty"></button><button class="cell" type="button" data-index="7" aria-label="Bottom middle, empty"></button><button class="cell" type="button" data-index="8" aria-label="Bottom right, empty"></button>
			</div>
			<div class="actions"><button class="action-button primary" id="new-round" type="button">New round <span aria-hidden="true">↗</span></button><button class="action-button" id="reset-scores" type="button">Reset scores</button></div>
		</section>
		<p class="hint" id="mode-hint">Take turns with a friend · X goes first</p>
	</main>
	<script>
		(()=>{
			const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
			const positions=['Top left','Top middle','Top right','Middle left','Center','Middle right','Bottom left','Bottom middle','Bottom right'];
			const cells=[...document.querySelectorAll('.cell')],statusText=document.getElementById('status-text'),statusDot=document.getElementById('status-dot');
			const scores={X:0,O:0,draw:0};let board=Array(9).fill(''),turn='X',finished=false,computerMode=false,round=1;
			function updateScores(winner=''){
				document.getElementById('score-x').textContent=scores.X;document.getElementById('score-o').textContent=scores.O;document.getElementById('score-draw').textContent=scores.draw;
				document.getElementById('score-card-x').classList.toggle('active',!finished&&turn==='X');document.getElementById('score-card-o').classList.toggle('active',!finished&&turn==='O');
				if(winner)document.getElementById(`score-card-${winner.toLowerCase()}`).classList.add('active');
			}
			function setStatus(message,marker=turn){statusText.textContent=message;statusDot.className='status-dot'+(marker==='O'?' o':marker==='draw'?' draw':'')}
			function render(){
				cells.forEach((cell,i)=>{const mark=board[i];cell.textContent=mark==='X'?'×':mark==='O'?'○':'';cell.className='cell'+(mark?' '+mark.toLowerCase():'');cell.disabled=Boolean(mark)||finished||(computerMode&&turn==='O');cell.setAttribute('aria-label',`${positions[i]}, ${mark||'empty'}`)});
				document.getElementById('round-label').textContent=`ROUND ${round}`;updateScores();
			}
			function winnerFor(state){for(const line of wins)if(state[line[0]]&&state[line[0]]===state[line[1]]&&state[line[1]]===state[line[2]])return{player:state[line[0]],line};return null}
			function finishRound(result){
				finished=true;
				if(result){scores[result.player]++;result.line.forEach(i=>cells[i].classList.add('winner'));setStatus(`${computerMode&&result.player==='O'?'Computer':`Player ${result.player}`} wins!`,result.player)}
				else{scores.draw++;setStatus("It's a draw!",'draw')}
				render();if(result){result.line.forEach(i=>cells[i].classList.add('winner'));updateScores(result.player)}
			}
			function makeMove(index){
				if(finished||board[index]||(computerMode&&turn==='O'))return;
				board[index]=turn;const result=winnerFor(board);if(result)return finishRound(result);if(board.every(Boolean))return finishRound(null);
				turn=turn==='X'?'O':'X';setStatus(computerMode&&turn==='O'?'Computer is thinking…':`${turn}'s turn`,turn);render();if(computerMode&&turn==='O')window.setTimeout(computerMove,380);
			}
			function minimax(state,isMaximizing,depth=0){
				const result=winnerFor(state);if(result)return result.player==='O'?10-depth:depth-10;if(state.every(Boolean))return 0;
				let best=isMaximizing?-Infinity:Infinity;
				for(let i=0;i<9;i++){if(state[i])continue;state[i]=isMaximizing?'O':'X';const value=minimax(state,!isMaximizing,depth+1);state[i]='';best=isMaximizing?Math.max(best,value):Math.min(best,value)}
				return best;
			}
			function computerMove(){
				if(!computerMode||finished||turn!=='O')return;let bestScore=-Infinity,bestMoves=[];
				for(let i=0;i<9;i++){if(board[i])continue;board[i]='O';const score=minimax(board,false);board[i]='';if(score>bestScore){bestScore=score;bestMoves=[i]}else if(score===bestScore)bestMoves.push(i)}
				const move=bestMoves[Math.floor(Math.random()*bestMoves.length)];if(move!==undefined){board[move]='O';const result=winnerFor(board);if(result)return finishRound(result);if(board.every(Boolean))return finishRound(null);turn='X';setStatus('Your turn','X');render()}
			}
			function newRound(){board=Array(9).fill('');turn='X';finished=false;round++;setStatus(computerMode?'Your turn':"X's turn",'X');render();cells[0].focus()}
			function setMode(useComputer){computerMode=useComputer;document.getElementById('two-player-mode').setAttribute('aria-pressed',String(!useComputer));document.getElementById('computer-mode').setAttribute('aria-pressed',String(useComputer));document.getElementById('o-label').textContent=useComputer?'COMPUTER / O':'PLAYER 2 / O';document.getElementById('mode-hint').textContent=useComputer?'You are X · The computer plays O':'Take turns with a friend · X goes first';scores.X=scores.O=scores.draw=0;round=1;board=Array(9).fill('');turn='X';finished=false;setStatus(useComputer?'Your turn':"X's turn",'X');render()}
			cells.forEach(cell=>cell.addEventListener('click',()=>makeMove(Number(cell.dataset.index))));
			document.getElementById('two-player-mode').addEventListener('click',()=>setMode(false));document.getElementById('computer-mode').addEventListener('click',()=>setMode(true));document.getElementById('new-round').addEventListener('click',newRound);
			document.getElementById('reset-scores').addEventListener('click',()=>{scores.X=scores.O=scores.draw=0;round=1;board=Array(9).fill('');turn='X';finished=false;setStatus(computerMode?'Your turn':"X's turn",'X');render()});render();
		})();
	</script>
</body>
</html>
